# git-cliff configuration for EmoteRing
# https://git-cliff.org/docs/configuration

[changelog]
# Markdown header shown once at the top of the generated changelog.
header = """
# Changelog

Alle nennenswerten Änderungen an EmoteRing werden in dieser Datei
dokumentiert. Das Format orientiert sich an [Keep a Changelog] und die
Versionierung an [Semantic Versioning].

[Keep a Changelog]: https://keepachangelog.com/de/1.1.0/
[Semantic Versioning]: https://semver.org/lang/de/
"""

# Template for each release/group block (Tera syntax).
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]\
        {%- if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.breaking %} [**breaking**]{% endif %} \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/pinged-eu/EmoteRing/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}\n
"""

# Remove leading/trailing whitespace from the template.
trim = true

footer = """
<!-- generated by git-cliff -->
"""

# Render the body even when no commits match any group.
render_always = false

[git]
# Parse only commits that follow the Conventional Commits specification.
conventional_commits = true
# Fail (and skip) parsing non-conventional commits instead of erroring out.
filter_unconventional = true
# Split commits on newlines and process each line as an individual commit
# where applicable.
split_commits = false
# Exclude commits that have no matching regex in commit_parsers (e.g. merges
# without a conventional prefix, GitButler workspace commits).
filter_commits = true
# Keep only commits reachable from the current branch's tags; adjust if you
# tag releases differently.
tag_pattern = "v[0-9]*"
# Order commits oldest first within a release block.
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore\\(deps\\)", group = "<!-- 7 -->Dependencies" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 8 -->Miscellaneous Tasks" },
  { message = "^ci", group = "<!-- 9 -->Continuous Integration" },
  { message = "^build", group = "<!-- 10 -->Build System" },
  { message = "^revert", group = "<!-- 11 -->Reverts" },
  { message = "^init", group = "<!-- 12 -->Initial Import" },
  { message = "^GitButler Workspace Commit", skip = true },
  { message = ".*", group = "<!-- 13 -->Other" },
]

protect_breaking_commits = true

link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/pinged-eu/EmoteRing/issues/$1" },
]

[bump]
# Derive the next semantic version from Conventional Commit types
# (feat -> minor, fix/other -> patch, "!"/BREAKING CHANGE -> major).
features_always_bump_minor = true
breaking_always_bump_major = true
